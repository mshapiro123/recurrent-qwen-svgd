<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="850" viewBox="0 0 1180 850" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A7A75"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="850" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="30" y="34" font-size="19" font-weight="bold" fill="#1F1F1D">Phase 3 training signals: the frozen base, the trained sidecar, and the supervision stack</text>
  <text x="30" y="54" font-size="12" fill="#7A7A75">Answer-gap program. Inference uses only the left two columns. Every signal in the right column exists at training time only.</text>

  <!-- Legend -->
  <g font-size="11" fill="#4A4A46">
    <rect x="758" y="22" width="14" height="14" fill="#E8E8E6" stroke="#7A7A75" stroke-width="1"/>
    <text x="777" y="33">frozen / pretrained</text>
    <rect x="888" y="22" width="14" height="14" fill="#EFF4FF" stroke="#2563EB" stroke-width="1"/>
    <text x="907" y="33">trained (primary path)</text>
    <rect x="1040" y="22" width="14" height="14" fill="#FEF3E2" stroke="#B45309" stroke-width="1"/>
    <text x="1059" y="33">secondary path</text>
    <line x1="758" y1="47" x2="772" y2="47" stroke="#7A7A75" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="777" y="51">training-time-only signal (never at inference)</text>
  </g>

  <!-- ===================== Column 1: frozen base ===================== -->
  <rect x="30" y="80" width="290" height="620" rx="8" fill="#F6F6F3" stroke="#E2E2DE" stroke-width="1.5"/>
  <text x="45" y="104" font-size="14" font-weight="bold" fill="#1F1F1D">Frozen base model</text>
  <text x="45" y="121" font-size="11" fill="#7A7A75">Qwen2.5-0.5B-Instruct, 24 layers, d = 896</text>

  <rect x="55" y="140" width="240" height="44" rx="5" fill="#E8E8E6" stroke="#7A7A75" stroke-width="1"/>
  <text x="175" y="158" font-size="12" text-anchor="middle" fill="#1F1F1D">Token embeddings</text>
  <text x="175" y="174" font-size="10" text-anchor="middle" fill="#7A7A75">tied, vocab 151,936</text>

  <line x1="175" y1="184" x2="175" y2="204" stroke="#7A7A75" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="55" y="206" width="240" height="120" rx="5" fill="#E8E8E6" stroke="#7A7A75" stroke-width="1"/>
  <text x="175" y="228" font-size="12" text-anchor="middle" fill="#1F1F1D">Transformer layers 0 to L*</text>
  <text x="175" y="244" font-size="10" text-anchor="middle" fill="#7A7A75">frozen, no gradient</text>
  <rect x="75" y="256" width="200" height="54" rx="4" fill="#FFFFFF" stroke="#7A7A75" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="175" y="274" font-size="11" text-anchor="middle" fill="#1F1F1D">hidden state h_p read here</text>
  <text x="175" y="290" font-size="10" text-anchor="middle" fill="#7A7A75">per-position, d = 896</text>
  <text x="175" y="303" font-size="10" text-anchor="middle" fill="#7A7A75">to sidecar initializer</text>

  <!-- injection point -->
  <line x1="175" y1="326" x2="175" y2="352" stroke="#7A7A75" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="55" y="354" width="240" height="72" rx="5" fill="#EFF4FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="175" y="374" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F1F1D">Injection point: h_p + u_p</text>
  <text x="175" y="390" font-size="10" text-anchor="middle" fill="#4A4A46">bounded write u_p from the bridge</text>
  <text x="175" y="404" font-size="10" text-anchor="middle" fill="#4A4A46">‖u‖ clamped at c·p99, c = 0.15</text>
  <text x="175" y="418" font-size="10" text-anchor="middle" fill="#4A4A46">position zero closed</text>

  <line x1="175" y1="426" x2="175" y2="450" stroke="#7A7A75" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="55" y="452" width="240" height="70" rx="5" fill="#E8E8E6" stroke="#7A7A75" stroke-width="1"/>
  <text x="175" y="474" font-size="12" text-anchor="middle" fill="#1F1F1D">Transformer layers L* to 23</text>
  <text x="175" y="490" font-size="10" text-anchor="middle" fill="#7A7A75">frozen, carries the written state</text>
  <text x="175" y="506" font-size="10" text-anchor="middle" fill="#7A7A75">to the final norm</text>

  <line x1="175" y1="522" x2="175" y2="544" stroke="#7A7A75" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="55" y="546" width="240" height="44" rx="5" fill="#E8E8E6" stroke="#7A7A75" stroke-width="1"/>
  <text x="175" y="564" font-size="12" text-anchor="middle" fill="#1F1F1D">LM head (tied)</text>
  <text x="175" y="580" font-size="10" text-anchor="middle" fill="#7A7A75">next-token logits</text>

  <text x="45" y="622" font-size="10" fill="#7A7A75">Zero-loop identity asserted every run:</text>
  <text x="45" y="636" font-size="10" fill="#7A7A75">with all gates closed the base is bit-exact.</text>
  <text x="45" y="662" font-size="10" fill="#4A4A46" font-weight="bold">496M parameters, all frozen</text>
  <text x="45" y="678" font-size="10" fill="#7A7A75">gradients flow through, never into, the base</text>

  <!-- ===================== Column 2: trained sidecar ===================== -->
  <rect x="350" y="80" width="380" height="620" rx="8" fill="#F6F6F3" stroke="#E2E2DE" stroke-width="1.5"/>
  <text x="365" y="104" font-size="14" font-weight="bold" fill="#1F1F1D">Trained sidecar</text>
  <text x="365" y="121" font-size="11" fill="#7A7A75">1,184,917 trained params (Phase 2 receipt) — Phase 3 count set by the gate-head build receipt</text>

  <rect x="375" y="140" width="330" height="78" rx="5" fill="#EFF4FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="540" y="158" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F1F1D">Initializer (canonicalizer)</text>
  <text x="540" y="174" font-size="10" text-anchor="middle" fill="#4A4A46">per-layer RMSNorm → learned layer mixture</text>
  <text x="540" y="188" font-size="10" text-anchor="middle" fill="#4A4A46">→ predictive RRR rank 256 → partial whitening z_α</text>
  <text x="540" y="202" font-size="10" text-anchor="middle" fill="#4A4A46">shared frozen PCA basis, λ_eff floors, fp64 fit</text>

  <line x1="540" y1="218" x2="540" y2="240" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrB)"/>

  <rect x="375" y="242" width="330" height="58" rx="5" fill="#EFF4FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="540" y="262" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F1F1D">Scratchpad state S</text>
  <text x="540" y="278" font-size="10" text-anchor="middle" fill="#4A4A46">8 slots × 128 dims: 4 future slots + 4 masked slots</text>
  <text x="540" y="292" font-size="10" text-anchor="middle" fill="#4A4A46">persistent, never renormalized</text>

  <line x1="540" y1="300" x2="540" y2="322" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrB)"/>

  <rect x="375" y="324" width="330" height="78" rx="5" fill="#EFF4FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="540" y="342" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F1F1D">Flow module × K (K ≤ 4 loops)</text>
  <text x="540" y="358" font-size="10" text-anchor="middle" fill="#4A4A46">z ← z + m_k · ū_k (direction–magnitude factorized)</text>
  <text x="540" y="372" font-size="10" text-anchor="middle" fill="#4A4A46">per-slot RMSNorm direction, softplus magnitude</text>
  <text x="540" y="386" font-size="10" text-anchor="middle" fill="#4A4A46">answer losses at every loop k, weight w_k = k/K</text>

  <!-- loop-back arrow -->
  <path d="M 705 363 C 725 363 725 271 705 271" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrB)"/>
  <text x="722" y="320" font-size="9" fill="#2563EB" transform="rotate(90 722 320)">×K</text>

  <line x1="540" y1="402" x2="540" y2="424" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrB)"/>

  <rect x="375" y="426" width="330" height="92" rx="5" fill="#EFF4FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="540" y="444" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F1F1D">Gated clamped bridge</text>
  <text x="540" y="460" font-size="10" text-anchor="middle" fill="#4A4A46">inputs: h_p, S, 32-dim control state</text>
  <text x="540" y="474" font-size="10" text-anchor="middle" fill="#4A4A46">outputs: u_p + per-position gate (proposed new head, Phase 3)</text>
  <text x="540" y="488" font-size="10" text-anchor="middle" fill="#4A4A46">gate ceiling γ set by the annealing controller</text>
  <text x="540" y="502" font-size="10" text-anchor="middle" fill="#4A4A46">norm cap c·p99 with c = 0.15, ρ = 0.95</text>

  <!-- writeback arrow to column 1 -->
  <path d="M 375 470 C 340 470 340 390 297 390" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrB)"/>
  <text x="336" y="440" font-size="10" fill="#2563EB" font-weight="bold" text-anchor="middle">u_p</text>

  <!-- draft head secondary -->
  <line x1="620" y1="518" x2="620" y2="546" stroke="#B45309" stroke-width="1.5" marker-end="url(#arrO)"/>
  <rect x="470" y="548" width="235" height="72" rx="5" fill="#FEF3E2" stroke="#B45309" stroke-width="1.5"/>
  <text x="587" y="566" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F1F1D">Residual draft head</text>
  <text x="587" y="582" font-size="10" text-anchor="middle" fill="#4A4A46">J = 4 draft positions, rank-64 adapters</text>
  <text x="587" y="596" font-size="10" text-anchor="middle" fill="#4A4A46">speculative drafts, acceptance is a byproduct</text>
  <text x="587" y="610" font-size="10" text-anchor="middle" fill="#4A4A46">secondary objective in Phase 3</text>

  <text x="365" y="648" font-size="10" fill="#7A7A75">Primary objective: move the augmented final prediction</text>
  <text x="365" y="662" font-size="10" fill="#7A7A75">toward the 14B teacher on the high-teachability stratum.</text>
  <text x="365" y="682" font-size="10" fill="#4A4A46" font-weight="bold">P3.3 trains bridge + gate + control only. P3.4 trains jointly.</text>

  <!-- ===================== Column 3: training-time-only signals ===================== -->
  <rect x="760" y="80" width="390" height="620" rx="8" fill="#F6F6F3" stroke="#E2E2DE" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="775" y="104" font-size="14" font-weight="bold" fill="#1F1F1D">Training-time-only signal stack</text>
  <text x="775" y="121" font-size="11" fill="#7A7A75">14B teacher and oracle quantities, barred from inference</text>

  <rect x="785" y="140" width="340" height="66" rx="5" fill="#FFFFFF" stroke="#7A7A75" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="955" y="158" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F1F1D">Canonicalized teacher states</text>
  <text x="955" y="174" font-size="10" text-anchor="middle" fill="#4A4A46">Qwen2.5-14B hidden futures, 181,969 anchors</text>
  <text x="955" y="188" font-size="10" text-anchor="middle" fill="#4A4A46">→ flow targets Z̃ = (1−β)·sg[Z_k] + β·sg[Z_T]</text>

  <rect x="785" y="216" width="340" height="66" rx="5" fill="#FFFFFF" stroke="#7A7A75" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="955" y="234" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F1F1D">Teacher top-K lattice</text>
  <text x="955" y="250" font-size="10" text-anchor="middle" fill="#4A4A46">K = 128 token lattice with teachability T(K)</text>
  <text x="955" y="264" font-size="10" text-anchor="middle" fill="#4A4A46">→ L_KL: augmented student vs teacher distribution</text>

  <rect x="785" y="292" width="340" height="80" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="955" y="310" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F1F1D">Oracle direction cache (P3.2)</text>
  <text x="955" y="326" font-size="10" text-anchor="middle" fill="#4A4A46">d*(p) = ∇_h m(h_p) / ‖∇_h m(h_p)‖, sidecar-inactive base</text>
  <text x="955" y="340" font-size="10" text-anchor="middle" fill="#4A4A46">m = teacher-token margin, cached bf16 ≈ 1.8 KB/position</text>
  <text x="955" y="354" font-size="10" text-anchor="middle" fill="#4A4A46">→ L_aim = 1 − cos(u_p, d*), and gate labels → L_gate</text>
  <text x="955" y="367" font-size="9" text-anchor="middle" fill="#7A7A75">98.4% token-flip rate, closest-distance quartile — first time as a target</text>

  <rect x="785" y="382" width="340" height="52" rx="5" fill="#FFFFFF" stroke="#7A7A75" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="955" y="400" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F1F1D">Verified answers</text>
  <text x="955" y="416" font-size="10" text-anchor="middle" fill="#4A4A46">teacher-verified labels → L_CE on final answers</text>
  <text x="955" y="429" font-size="10" text-anchor="middle" fill="#4A4A46">high-teachability stratum: teacher right, student wrong</text>

  <rect x="785" y="444" width="340" height="110" rx="5" fill="#FFFFFF" stroke="#7A7A75" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="955" y="462" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F1F1D">Annealing controller</text>
  <text x="955" y="478" font-size="10" text-anchor="middle" fill="#4A4A46">reads aim capture π and collateral χ each window</text>
  <text x="955" y="494" font-size="10" text-anchor="middle" fill="#4A4A46" font-family="monospace">rung:      0     1     2     3</text>
  <text x="955" y="508" font-size="10" text-anchor="middle" fill="#4A4A46" font-family="monospace">requires:  —    π≥.10 π≥.25 π≥.40</text>
  <text x="955" y="522" font-size="10" text-anchor="middle" fill="#4A4A46" font-family="monospace">gate γ:   0.02  0.08  0.20  0.50</text>
  <text x="955" y="536" font-size="10" text-anchor="middle" fill="#4A4A46" font-family="monospace">λ_pres:   1.0   0.5   0.2   0.05</text>
  <text x="955" y="549" font-size="9" text-anchor="middle" fill="#7A7A75">advance one rung per window, demote only on the battery floor</text>

  <rect x="785" y="564" width="340" height="56" rx="5" fill="#FFFFFF" stroke="#B45309" stroke-width="1.2"/>
  <text x="955" y="582" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F1F1D">The one hard cliff</text>
  <text x="955" y="598" font-size="10" text-anchor="middle" fill="#4A4A46">reference battery more than 3 points below the frozen</text>
  <text x="955" y="612" font-size="10" text-anchor="middle" fill="#4A4A46">base on two consecutive evaluations → stop</text>

  <text x="775" y="648" font-size="10" fill="#7A7A75">Deployment legality: these signals supervise training.</text>
  <text x="775" y="662" font-size="10" fill="#7A7A75">Inference runs the 0.5B base plus the trained sidecar alone —</text>
  <text x="775" y="676" font-size="10" fill="#7A7A75">no teacher, no oracle, no lattice, no controller.</text>

  <!-- dashed signal arrows from column 3 into column 2 -->
  <path d="M 785 173 C 750 173 750 179 705 179" fill="none" stroke="#7A7A75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <path d="M 785 249 C 748 249 748 271 705 271" fill="none" stroke="#7A7A75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <path d="M 785 332 C 742 332 742 450 705 450" fill="none" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrB)"/>
  <path d="M 785 408 C 738 408 738 470 705 470" fill="none" stroke="#7A7A75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <path d="M 785 499 C 734 499 734 488 705 488" fill="none" stroke="#7A7A75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <!-- ===================== Footer ===================== -->
  <rect x="30" y="716" width="1120" height="66" rx="8" fill="#F6F6F3" stroke="#E2E2DE" stroke-width="1.5"/>
  <text x="590" y="742" font-size="14" text-anchor="middle" fill="#1F1F1D" font-family="Georgia, serif" font-style="italic">gap_closed  =  ( A_augmented − A_base )  /  ( A_14B − A_base )</text>
  <text x="590" y="764" font-size="11" text-anchor="middle" fill="#4A4A46">the phase's reported currency: zero is the current result, one is a 0.5B that answers like a 14B — evaluated per battery with bootstrap intervals</text>

  <text x="30" y="812" font-size="10" fill="#7A7A75">Latent-space reasoning program — Phase 3 opening charter, 2026-08-09, figure r2 per technical amendment t1. Base: Qwen2.5-0.5B-Instruct (496M frozen). Sidecar: 1,184,917 trained (Phase 2 receipt). Teacher: Qwen2.5-14B (training-time only).</text>
  <text x="30" y="828" font-size="10" fill="#7A7A75">Static authored SVG, recorded as generator-less. Write-bound shorthand is subordinate to the bridge forward equation in code (canonical, per amendment B3). Numeric values trace to banked evidence records or are v1 defaults with revisit labels (rung table).</text>
</svg>