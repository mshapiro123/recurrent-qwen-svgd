<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Macro architecture of the recurrent Qwen retrofit</title>
  <desc id="desc">Tokens pass through a six-layer Prelude, a twelve-layer recurrent block, and a six-layer Coda. Later recurrent passes re-inject the fixed Prelude representation through a split bridge.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#30424d"/></marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#1f2428}.sub{font:400 16px Arial,sans-serif;fill:#4b5963}
      .label{font:700 18px Arial,sans-serif;fill:#1f2428}.small{font:400 14px Arial,sans-serif;fill:#4b5963}
      .mono{font:600 14px Consolas,monospace;fill:#24313a}.arrow{stroke:#30424d;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="620" fill="#fbfaf6"/>
  <text x="60" y="58" class="title">Identity-preserving recurrent-depth retrofit</text>
  <text x="60" y="88" class="sub">Qwen2.5-0.5B-Instruct: 24 pretrained layers split at a=6 and b=18</text>

  <rect x="55" y="185" width="125" height="98" rx="8" fill="#ffffff" stroke="#98a5ad" stroke-width="2"/>
  <text x="117" y="224" text-anchor="middle" class="label">Tokens</text>
  <text x="117" y="250" text-anchor="middle" class="small">causal prompt</text>

  <rect x="245" y="160" width="230" height="150" rx="8" fill="#e8f2ef" stroke="#14635e" stroke-width="3"/>
  <text x="360" y="208" text-anchor="middle" class="label">Prelude</text>
  <text x="360" y="238" text-anchor="middle" class="mono">layers 0-5</text>
  <text x="360" y="270" text-anchor="middle" class="small">fixed input anchor p</text>

  <rect x="555" y="145" width="275" height="180" rx="8" fill="#eef0f5" stroke="#3a4a55" stroke-width="3"/>
  <text x="692" y="196" text-anchor="middle" class="label">Recurrent block</text>
  <text x="692" y="226" text-anchor="middle" class="mono">layers 6-17</text>
  <text x="692" y="258" text-anchor="middle" class="small">same 12 layers reused per loop</text>
  <text x="692" y="286" text-anchor="middle" class="small">h(t+1) = Block(u(t))</text>

  <rect x="910" y="160" width="190" height="150" rx="8" fill="#f4eee2" stroke="#9b4827" stroke-width="3"/>
  <text x="1005" y="208" text-anchor="middle" class="label">Coda</text>
  <text x="1005" y="238" text-anchor="middle" class="mono">layers 18-23</text>
  <text x="1005" y="270" text-anchor="middle" class="small">LM head / reader</text>

  <path d="M180 234 H245" class="arrow"/><path d="M475 234 H555" class="arrow"/><path d="M830 234 H910" class="arrow"/>

  <rect x="475" y="410" width="250" height="120" rx="8" fill="#fff" stroke="#6b5876" stroke-width="3"/>
  <text x="600" y="450" text-anchor="middle" class="label">Split re-entry bridge</text>
  <text x="600" y="478" text-anchor="middle" class="small">combines fixed p with prior state h(t)</text>
  <text x="600" y="504" text-anchor="middle" class="mono">active only for loop t &gt; 1</text>
  <path d="M360 310 V470 H475" class="arrow"/>
  <path d="M692 325 V370 C692 388 682 410 680 410" class="arrow"/>
  <path d="M725 470 H855 V340 H735" class="arrow"/>

  <rect x="55" y="395" width="330" height="145" rx="8" fill="#ffffff" stroke="#b7c0c5" stroke-width="2"/>
  <text x="75" y="430" class="label">One-loop identity contract</text>
  <text x="75" y="462" class="small">At max_loops=1, each pretrained layer runs once</text>
  <text x="75" y="488" class="small">in its original order; the bridge is bypassed.</text>
  <text x="75" y="520" class="mono">Prelude -> Block -> Coda</text>
</svg>
