  halting: false
  reentry_adapter: false
  latent: false
recurrence_curriculum:
  enabled: false
  start_loop: 2
  end_loop: 2
  ramp_compute: false
lineage_policy:
  status: allowed
  regime: disposable_measurement
  full_block_trainable: true
  detachable_adapter: false
  checkpoint_promotable: false
  successor_source_allowed: false
  keeper_successor: false
