model_name: Qwen/Qwen2.5-0.5B-Instruct
dtype: bfloat16
adapter_dtype: float32
attn_implementation: default
layer_split: 6,18
max_length: 640
max_loops: 12
loop_loss_mode: weighted_per_loop_labels
row_specific_forward_loops: true
beta: 0.0
halt_target_nll_weight: 0.0
loop_control_ce_weight: 0.0
batch_size: 1
gradient_accumulation_steps: 8
minimum_effective_batch_size: 8
seed: 81903
optimizer: adamw
reject_muon: true
learning_rate: 1.0e-05
adamw_lr: 1.0e-05
weight_decay: 0.0
max_grad_norm: 0.5
max_steps: 334
save_every: 100
log_every: 25
bridge_projection_mode: split
bridge_prelude_lr_multiplier: 10.0
bridge_prelude_weight_decay: 0.0
bridge_prelude_lr_include_norm: false
bridge_prelude_grad_multiplier: 1.0
train_on_prompt: false
gradient_checkpointing: true
require_active_supervision: true
require_nonzero_train_gradient: true
output_dir: outputs/stage5/stage5_adapter_parity_e4_20260719/train/inverse_rehearsal
resume_from: outputs/stage5/stage5_adapter_parity_e4_20260719/restored/arm_e_final.pt
recurrence_curriculum:
  enabled: false
  start_loop: 12
  end_loop: 12
  schedule: linear
  target_source: row_capped
  ramp_compute: false
canary_every: 100
canary_specs:
- name: natural_surface
  data_jsonl: outputs/stage5/stage5_adapter_parity_e4_20260719/guardrail_data/natural_surface_relay_pointer_16_each_d1_8.jsonl
  baseline_accuracy: 0.234375
  hard_stop_delta: -0.03
  value_prefix: 'name:'
  mode: diagonal
  max_depth: 8
- name: tier1_arithmetic
  data_jsonl: outputs/stage5/stage5_adapter_budget_arm_e_20260718/data/base_capability_canary_64.jsonl
  baseline_accuracy: 0.9375
  hard_stop_delta: -0.03
  value_prefix: 'name:'
  mode: loop1
  max_depth: 1
checkpoint_backup_every: 100
checkpoint_backup_dir: /content/drive/MyDrive/recurrent-qwen-svgd-checkpoints/stage5_adapter_parity_e4_20260719/inverse_rehearsal
synthetic_phase: adapter_parity_e4
synthetic_stage: inverse_table_25pct_forward_rehearsal
training_mode: frozen_lora
resume_lora:
  enabled: true
  rank: 16
  alpha: 32
  dropout: 0.0
require_all_lora_loaded: true
require_loaded_prefixes:
- bridge.
merge_lora_before_unfreeze: false
require_lora_loaded_before_merge: false
require_frozen_base_hash: true
train_auxiliary:
  bridge: true
  halting: false
  reentry_adapter: false
  latent: false
